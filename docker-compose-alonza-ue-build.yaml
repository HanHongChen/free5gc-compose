  console:
    container_name: fru-console
    image: free-ran-ue:latest
    command: ./free-ran-ue console -c consolecfg.yaml
    volumes:
      - ./config/fru-consolecfg.yaml:/free-ran-ue/consolecfg.yaml
    networks:
      console-rans:
        ipv4_address: 10.0.40.2
    ports:
      - "40104:40104"
    depends_on:
      - gnb-master
      - gnb-secondary

networks:
  sbi:
    ipam:
      driver: default
      config:
        - subnet: 10.100.200.0/24
    driver_opts:
      com.docker.network.bridge.name: br-sbi
  cn-rans:
    ipam:
      driver: default
      config:
        - subnet: 10.0.10.0/24
    driver_opts:
      com.docker.network.bridge.name: br-cn-rans

  # mran-ue:
  #   ipam:
  #     driver: default
  #     config:
  #       - subnet: 10.0.20.0/24
