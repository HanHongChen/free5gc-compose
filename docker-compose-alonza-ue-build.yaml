  #     config:
  #       - subnet: 10.0.30.0/24
  #   driver_opts:
  #     com.docker.network.bridge.name: br-sran-ue

  console-rans:
    ipam:
      driver: default
      config:
        - subnet: 10.0.40.0/24
    driver_opts:
      com.docker.network.bridge.name: br-console-rans

volumes:
  dbdata: